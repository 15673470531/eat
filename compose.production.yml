# 单独使用此文件，避免加载本地 override。
services:
  app:
    build: .
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    extra_hosts:
      - host.docker.internal:host-gateway
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8087}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
