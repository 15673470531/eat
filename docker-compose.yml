services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eatwhat-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf
    networks:
      - eatwhat-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=172.17.0.1
      - DB_PORT=3306
      - DB_DATABASE=eatwhat
      - DB_USERNAME=eatwhat
      - DB_PASSWORD=eatwhat_pass

  nginx:
    image: nginx:alpine
    container_name: eatwhat-nginx
    restart: unless-stopped
    ports:
      - "8087:80"
      - "8447:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - eatwhat-network
    depends_on:
      - app
  adminer:
    image: adminer
    restart: always
    ports:
      - 18087:8080
    networks:
      - eatwhat-network

networks:
  eatwhat-network:
    driver: bridge
